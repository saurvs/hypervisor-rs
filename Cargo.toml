[package]
name = "hypervisor"
version = "0.1.0"
authors = ["Saurav Sachidanand <sauravsachidanand@gmail.com>"]
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Safe Rust bindings to Apple's Hypervisor.framework (Apple silicon and Intel Macs)"
repository = "https://github.com/saurvs/hypervisor-rs"
documentation = "https://docs.rs/hypervisor"
readme = "README.md"
keywords = ["hypervisor", "virtualization", "macos", "apple-silicon", "vmx"]
categories = ["api-bindings", "os::macos-apis", "virtualization"]
exclude = ["/.github", "/.cargo"]

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
