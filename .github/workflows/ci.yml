name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  apple-silicon:
    name: Apple silicon (stable)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target x86_64-apple-darwin
          rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (x86_64 cross-check)
        run: cargo clippy --all-targets --target x86_64-apple-darwin -- -D warnings
      # The runner in .cargo/config.toml signs binaries with the hypervisor
      # entitlement. Hosted runners are VMs and may not offer nested
      # virtualization: if the example can run a guest, the runtime tests
      # must run too; otherwise they skip themselves.
      - name: Run example (probes for the hypervisor)
        run: |
          if cargo run --example arm64_hello; then
            echo "HYPERVISOR_REQUIRE_VM=1" >> "$GITHUB_ENV"
          else
            echo "::notice::Hypervisor.framework is not usable on this runner; runtime tests will skip"
          fi
      - run: cargo test
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps
          cargo doc --no-deps --target x86_64-apple-darwin
      - run: cargo package
      - run: cargo publish --dry-run

  msrv:
    name: Apple silicon (MSRV 1.85)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install 1.85 --profile minimal --target x86_64-apple-darwin
          rustup default 1.85
      - run: cargo build --all-targets
      - run: cargo build --all-targets --target x86_64-apple-darwin
      - run: cargo test

  intel:
    name: Intel (stable)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - run: cargo clippy --all-targets -- -D warnings
      - name: Run example (probes for the hypervisor)
        run: |
          if cargo run --example x86_64_hello; then
            echo "HYPERVISOR_REQUIRE_VM=1" >> "$GITHUB_ENV"
          else
            echo "::notice::Hypervisor.framework is not usable on this runner; runtime tests will skip"
          fi
      - run: cargo test

  other-platforms:
    name: Linux (crate is empty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo test
